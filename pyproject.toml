[project]
name = "movieplot"
version = "0.1.0"
description = "Fiches de films (synopsis, chronologie, fin, analyse) générées par un admin et publiées en lecture."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "pydantic>=2.9",
    "fastapi>=0.121",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "itsdangerous>=2.2",
]

[project.scripts]
movieplot = "movieplot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
lint = [
    "ruff>=0.14",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movieplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "webapp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ["^src/movieplot/db/migrations/versions/"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

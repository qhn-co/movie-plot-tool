# Image publiée sur GHCR sous le SHA complet du commit, jamais sous un tag mobile : la
# question « quelle version tourne ? » a une seule réponse, que `/api/version` confirme.
#
# Sur une PR, l'image est seulement construite (le Dockerfile reste vérifié) : rien n'est
# publié depuis une branche qu'un fork pourrait proposer.
name: Image

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: S'authentifier auprès de GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire (et publier sur master)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/qhn-co/movie-plot-tool:${{ github.sha }}
          build-args: MOVIEPLOT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Résumé
        if: github.event_name == 'push'
        run: |
          {
            echo "### Image publiée"
            echo
            echo "\`ghcr.io/qhn-co/movie-plot-tool:${{ github.sha }}\`"
            echo
            echo "Digest : \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
